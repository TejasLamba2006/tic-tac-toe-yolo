[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stm32-yolo-pipeline"
version = "0.1.0"
description = "Automated ML pipeline for YOLO training, export, quantization, and STM32 deployment"
requires-python = ">=3.11"
license = {text = "MIT"}

dependencies = [
    "pyyaml>=6.0",
    "opencv-python>=4.8",
    "numpy>=1.24",
]

[project.optional-dependencies]
training = [
    "ultralytics>=8.0",
    "torch>=2.0",
    "torchvision>=0.15",
]
quantization = [
    "tensorflow>=2.13",
    "onnx>=1.12.0",
    "onnxruntime>=1.12.0",
    "onnxslim>=0.1.82",
    "onnx2tf",
    "tf_keras",
    "onnx_graphsurgeon",
    "ai_edge_litert",
    "sng4onnx"
]
stedge = [
    # The stm32ai_dc SDK is vendored under vendor/common/ (copied from
    # STMicroelectronics/stm32ai-modelzoo-services, commit 0f6210ed, because
    # upstream ships no pyproject.toml and the whole repo is large with
    # Windows-incompatible path lengths). It ships with the project install
    # via [tool.setuptools.packages.find] below. Only its runtime deps need
    # declaring here:
    "requests>=2.28",
    "marshmallow>=3.20",
    "tqdm>=4.60",
]
ui = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "python-multipart>=0.0.9",
    "jinja2>=3.1",
]
all = [
    "stm32-yolo-pipeline[training,quantization,stedge]",
]

[project.scripts]
pipeline = "pipeline.cli:main"

[tool.setuptools.packages.find]
# Project packages (pipeline, webui) live at the repo root; the vendored
# ST Edge AI SDK lives under vendor/common/ (importable as common.stm32ai_dc).
include = ["pipeline*", "webui*", "common*"]
where = [".", "vendor"]

[tool.pytest.ini_options]
testpaths = ["pipeline", "src/tests"]
pythonpath = ["."]
[tool.uv.sources]
torch = [
    { index = "pytorch-cpu" },
]
torchvision = [
    { index = "pytorch-cpu" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true