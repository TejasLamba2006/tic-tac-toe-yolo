[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stm32-yolo-pipeline"
version = "0.1.0"
description = "Automated ML pipeline for YOLO training, export, quantization, and STM32 deployment"
requires-python = ">=3.11"
license = {text = "MIT"}

dependencies = [
    "pyyaml>=6.0",
    "opencv-python>=4.8",
    "numpy>=1.24",
]

[project.optional-dependencies]
training = [
    "ultralytics>=8.0",
    "torch>=2.0",
    "torchvision>=0.15",
]
quantization = [
    "tensorflow>=2.13",
    "onnx>=1.12.0",
    "onnxruntime>=1.12.0",
    "onnxslim>=0.1.82",
    "onnx2tf",
    "tf_keras",
    "onnx_graphsurgeon",
    "ai_edge_litert",
    "sng4onnx"
]
stedge = [
    # The stm32ai_dc SDK ships inside the stm32ai-modelzoo-services git
    # submodule (see .gitmodules). Upstream has no pyproject.toml, so we
    # install it from the submodule path after `git submodule update --init`.
    "stm32ai_dc @ file:///./stm32ai-modelzoo-services/common",
]
ui = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "python-multipart>=0.0.9",
    "jinja2>=3.1",
]
all = [
    "stm32-yolo-pipeline[training,quantization,stedge]",
]

[project.scripts]
pipeline = "pipeline.cli:main"

[tool.setuptools.packages.find]
include = ["pipeline*", "webui*"]

[tool.pytest.ini_options]
testpaths = ["pipeline", "src/tests"]
pythonpath = ["."]
[tool.uv.sources]
torch = [
    { index = "pytorch-cpu" },
]
torchvision = [
    { index = "pytorch-cpu" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true