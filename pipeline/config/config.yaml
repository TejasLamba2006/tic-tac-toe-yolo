# =============================================================================
# Pipeline Configuration
# =============================================================================
#
# This file controls every stage of the automated ML pipeline.
# All paths are relative to the project root unless absolute.
#
# Credentials should be set via environment variables or a .env file:
#   STEDGE_USERNAME, STEDGE_PASSWORD, STEDGE_API_KEY
#
# =============================================================================

# Directory where all pipeline outputs are stored.
artifacts_dir: artifacts

# ---------------------------------------------------------------------------
# Logging
# ---------------------------------------------------------------------------
logging:
  level: INFO            # DEBUG, INFO, WARNING, ERROR
  log_dir: artifacts/logs
  log_to_console: true

# ---------------------------------------------------------------------------
# Dataset
# ---------------------------------------------------------------------------
dataset:
  # Path to the dataset root (relative to project root).
  path: dataset4

  # Subdirectory layout within the dataset path.
  train_images: train/images
  train_labels: train/labels
  val_images: val/images
  val_labels: val/labels
  test_images: test/images
  test_labels: test/labels

  image_extensions: [".jpg", ".jpeg", ".png", ".bmp"]

  # Set to true to re-split a flat dataset into train/val/test.
  # If train/val folders already exist, leave this false.
  split_enabled: false
  split_ratios:
    train: 0.8
    val: 0.1
    test: 0.1
  split_seed: 42

# ---------------------------------------------------------------------------
# Augmentation
# ---------------------------------------------------------------------------
augmentation:
  enabled: true
  output_dir: augmented

  # Pixel-level augmentations (safe: do not change bounding boxes).
  brightness_factors: [0.6, 1.4]
  contrast_factors: [0.7, 1.4]
  gaussian_blur: true
  gaussian_blur_kernel: 5
  noise_stddev: 10.0

  # Geometric augmentations are DISABLED by default because the existing
  # scripts do not transform labels alongside images.  Enable only if you
  # are certain labels will remain valid or you handle label transforms.
  rotate_enabled: false
  rotate_max_degrees: 5.0
  perspective_enabled: false
  perspective_max_shift: 15

  # Copy corresponding label files for each augmented image.
  copy_labels: true

# ---------------------------------------------------------------------------
# Training
# ---------------------------------------------------------------------------
training:
  model: yolov8n.pt
  data_yaml: data.yaml
  epochs: 100
  batch: 4
  imgsz: 320
  workers: 0
  patience: 100
  optimizer: auto
  lr0: 0.01
  lrf: 0.01
  momentum: 0.937
  weight_decay: 0.0005
  device: null
  project: null
  name: null
  exist_ok: true
  resume: false
  seed: 0
  deterministic: true
  amp: true
  cache: false
  plots: true
  save: true

# ---------------------------------------------------------------------------
# Export (ONNX)
# ---------------------------------------------------------------------------
export:
  opset: 12
  imgsz: 320
  simplify: false
  output_dir: export

# ---------------------------------------------------------------------------
# Quantization (TFLite INT8)
# ---------------------------------------------------------------------------
#
# NOTE: The existing implementation uses per_channel quantization with
# uint8 input and float output.  The README previously stated "per-tensor"
# but the code (scripts/config_quant.yaml) is the source of truth.
#
quantization:
  enabled: true
  quantization_type: per_channel     # per_channel or per_tensor
  quantization_input_type: uint8     # int8, uint8, or float
  quantization_output_type: float    # int8, uint8, or float
  input_shape: [320, 320, 3]
  rescaling_scale: 255.0
  rescaling_offset: 0.0
  fake: false
  calib_dataset_path: ""             # Auto-resolved from dataset.path if empty
  output_dir: quantization
  model_name: tictactoe_yolov8
  use_case: od_tictactoe

# ---------------------------------------------------------------------------
# ST Edge AI Developer Cloud Compilation
# ---------------------------------------------------------------------------
#
# Credentials: set via environment variables (preferred) or here.
#   STEDGE_USERNAME, STEDGE_PASSWORD, STEDGE_API_KEY
#
stedge:
  enabled: false
  target: ""                # e.g. STM32MP257F-DK
  optimization: ""
  board: ""
  runtime: ""
  output_dir: compilation
  username: ""              # Overridden by STEDGE_USERNAME env var
  password: ""              # Overridden by STEDGE_PASSWORD env var
  api_key: ""               # Overridden by STEDGE_API_KEY env var

# ---------------------------------------------------------------------------
# Deployment (SSH to STM32 board)
# ---------------------------------------------------------------------------
deployment:
  enabled: false
  host: ""
  port: 22
  username: ""
  password: ""
  ssh_key: ""
  remote_model_directory: ""
  remote_working_directory: ""
  inference_command: ""
  verification_command: ""
  benchmark_command: ""

# ---------------------------------------------------------------------------
# Benchmark
# ---------------------------------------------------------------------------
benchmark:
  enabled: false
  iterations: 100
  warmup_iterations: 10
  output_dir: benchmark

# ---------------------------------------------------------------------------
# Reports
# ---------------------------------------------------------------------------
report:
  enabled: true
  formats: [json, html, markdown]
  output_dir: reports
